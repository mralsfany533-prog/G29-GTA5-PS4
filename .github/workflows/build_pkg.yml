name: Build PS4 G29 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت المتطلبات الأساسية
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make wget unzip dotnet-runtime-6.0

      - name: 3. تحميل وتجهيز بيئة OpenOrbis PS4 Toolchain
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | grep "browser_download_url.*zip" | cut -d '"' -f 4 | head -n 1)
          wget -O openorbis.zip "$DOWNLOAD_URL"
          mkdir -p $HOME/OpenOrbis
          unzip -q openorbis.zip -d $HOME/OpenOrbis
          TOOLCHAIN_DIR=$(find $HOME/OpenOrbis -type d -name "bin" -exec dirname {} \; | head -n 1)
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          chmod +x "$TOOLCHAIN_DIR/bin/linux/"*

      - name: 4. ترجمة الكود وبناء ملف PKG
        run: |
          make

      - name: 5. رفع ملف PKG النهائي للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: G29_GTA5_Installer_PKG
          path: G29_GTA5_Installer.pkg
