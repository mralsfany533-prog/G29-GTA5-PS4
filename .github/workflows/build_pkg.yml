name: Build PS4 G29 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: openorbis/ps4-toolchain:latest

    steps:
      - name: 1. جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. ترجمة الكود وبناء ملف PKG
        run: |
          make

      - name: 3. رفع ملف PKG النهائي للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: G29_GTA5_Installer_PKG
          path: G29_GTA5_Installer.pkg
