name: Build PS4 G29 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت المتطلبات الأساسية (Clang & LLD & .NET)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make wget unzip dotnet-runtime-6.0

      - name: 3. تحميل وتجهيز بيئة OpenOrbis PS4 Toolchain
        run: |
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/OpenOrbis-PS4-Toolchain-v0.5.3-Linux.zip
          unzip -q OpenOrbis-PS4-Toolchain-v0.5.3-Linux.zip -d $HOME/OpenOrbis
          chmod +x $HOME/OpenOrbis/bin/linux/*

      - name: 4. ترجمة الكود وبناء ملف PKG
        env:
          OO_PS4_TOOLCHAIN: ${{ runner.home }}/OpenOrbis
        run: |
          make

      - name: 5. رفع ملف PKG النهائي للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: G29_GTA5_Installer_PKG
          path: G29_GTA5_Installer.pkg
