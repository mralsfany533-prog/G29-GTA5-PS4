name: Build PS4 G29 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت المتطلبات الأساسية
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make wget jq dotnet-runtime-6.0

      - name: 3. تحميل وتجهيز بيئة OpenOrbis PS4 Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_URL=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.3 | jq -r '.assets[] | select(.name | test("linux|tar\\.gz|zip"; "i")) | .browser_download_url' | head -n 1)
          echo "Downloading: $ASSET_URL"
          wget -q "$ASSET_URL" -O toolchain_pkg
          mkdir -p $HOME/OpenOrbis
          tar -xzf toolchain_pkg -C $HOME/OpenOrbis || unzip -q toolchain_pkg -d $HOME/OpenOrbis
          chmod +x $HOME/OpenOrbis/bin/linux/*

      - name: 4. ترجمة الكود وبناء ملف PKG
        env:
          OO_PS4_TOOLCHAIN: ${{ runner.home }}/OpenOrbis
        run: |
          make

      - name: 5. رفع ملف PKG النهائي للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: G29_GTA5_Installer_PKG
          path: G29_GTA5_Installer.pkg
